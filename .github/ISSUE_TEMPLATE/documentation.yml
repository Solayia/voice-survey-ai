name: 📝 Documentation
description: Signaler une documentation manquante, peu claire ou obsolète.
title: "[Docs] : "
labels: ["documentation", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        La documentation fait partie du produit. Aidez-nous à la garder exacte.
  - type: input
    id: document
    attributes:
      label: Document concerné
      description: Quel fichier de `docs/` (ou ailleurs) est concerné ?
      placeholder: docs/09_ARCHITECTURE_GLOBALE.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Qu'est-ce qui est erroné ou manquant ?
      description: Décrivez la lacune ou l'erreur de documentation.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Amélioration suggérée
      description: Comment corriger ou clarifier ?
    validations:
      required: false
