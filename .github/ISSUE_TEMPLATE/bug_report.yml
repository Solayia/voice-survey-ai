name: 🐛 Rapport de bug
description: Signaler un défaut ou un comportement inattendu dans VoiceSurvey AI.
title: "[Bug] : "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de remplir ce rapport. Donnez assez de détails pour que nous
        puissions reproduire et corriger le problème.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Description claire et concise du bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Comment reproduire le comportement ?
      placeholder: |
        1. Aller sur '...'
        2. Cliquer sur '...'
        3. Constater l'erreur
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Que deviez-vous obtenir ?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Zone concernée
      options:
        - Frontend
        - Backend / API
        - Téléphonie
        - IA / Moteur conversationnel
        - Moteur de workflows
        - Base de données
        - Infrastructure / Déploiement
        - Documentation
        - Autre
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: Version, navigateur, OS, déploiement (local/staging/prod), etc.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / captures d'écran
      description: Collez les logs pertinents ou joignez des captures. Masquez toute donnée personnelle ou secret.
    validations:
      required: false
