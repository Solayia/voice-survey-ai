name: ✨ Demande de fonctionnalité
description: Proposer une nouvelle fonctionnalité ou une amélioration pour VoiceSurvey AI.
title: "[Feature] : "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Rappel : **concevoir d'abord**. Toute fonctionnalité significative doit
        référencer ou mettre à jour le document concerné dans `docs/` avant
        l'implémentation.
  - type: textarea
    id: problem
    attributes:
      label: Problème / motivation
      description: Quel problème cela résout-il ? À qui cela profite-t-il ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solution proposée
      description: Décrivez la fonctionnalité et son fonctionnement attendu.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
      description: Autres approches considérées et raisons de leur rejet.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Zone concernée
      options:
        - Frontend
        - Backend / API
        - Téléphonie
        - IA / Moteur conversationnel
        - Moteur de workflows
        - Base de données
        - Infrastructure / Déploiement
        - Documentation
        - Autre
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Impact sur la documentation
      description: Quels documents de `docs/` doivent être créés ou mis à jour ?
    validations:
      required: false
